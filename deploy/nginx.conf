# Include only inside the host nginx http {} context. This is an independent vhost.
# Before enabling TLS, obtain the certificate with the HTTP bootstrap in DEPLOY.md.
map $http_upgrade $zhihui_web_connection {
    default upgrade;
    '' close;
}
server {
    listen 80;
    server_name zhihui.helms.wiki;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/zhihui-web-acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name zhihui.helms.wiki;
    ssl_certificate /etc/letsencrypt/live/zhihui.helms.wiki/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zhihui.helms.wiki/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # 200 MiB audio plus multipart framing; backend independently enforces file size.
    client_max_body_size 201m;
    client_body_timeout 120s;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "microphone=(self), display-capture=(self)" always;
    # No access log containing expiring provider download tokens, account names,
    # invitation tokens or meeting IDs. Do not enable request-body logging.
    access_log off;
    # Nginx upstream errors include the complete request URI, so even its error
    # log must not persist invitation/provider bearer tokens.
    error_log /dev/null crit;
    location / {
        proxy_pass http://127.0.0.1:8810;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $zhihui_web_connection;
        # Preserve Range/If-Range and authenticated downloads. Provider token
        # validity is checked by the application; never alias its storage directory.
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 7500s;
        proxy_send_timeout 120s;
    }
}
